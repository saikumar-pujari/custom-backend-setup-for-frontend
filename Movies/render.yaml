services:
  - type: web
    name: streamhub
    env: python
    rootDir: Movies
    buildCommand: "pip install -r requirements.txt && python manage.py migrate && python manage.py sync_domains && python manage.py populate_catalog && python manage.py collectstatic --noinput"
    startCommand: "gunicorn streamhub.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DEBUG
        value: "False"
      - key: TMDB_API_KEY
        value: "4a1e36ee37d8dbb5691e45ecf61c7dcb"
